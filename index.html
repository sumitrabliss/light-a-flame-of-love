<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="b754591d-71dc-490f-a036-1729368eba30"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light a Flame of Love | Global Resonance 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Montserrat:wght@100;200;300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --flame-amber: #f59e0b;
            --crystal-pink: #f472b6;
            --love-rose: #e11d48;
            --divine-gold: #fbbf24;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            transition: background-color 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-attachment: fixed;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, .font-fancy {
            font-family: 'Cinzel Decorative', cursive;
            letter-spacing: 0.15em;
        }
        .glass {
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .dark .glass {
            background: rgba(8, 8, 14, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .crystal-border {
            position: relative;
            background-clip: padding-box;
            border: 1px solid transparent;
            border-radius: 2rem;
        }
        @media (min-width: 768px) { .crystal-border { border-radius: 4.5rem; } }
        .crystal-border::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -2px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(251,191,36,0.4), rgba(244,114,182,0.4), rgba(255,255,255,0.7));
            background-size: 300% 300%;
            animation: borderRotate 12s linear infinite;
        }
        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .flame-marker {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 50% 50%, #fff 0%, var(--divine-gold) 25%, var(--flame-amber) 55%, var(--love-rose) 100%);
            border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
            box-shadow: 0 0 15px var(--flame-amber), 0 0 35px var(--divine-gold);
            animation: flameBreath 3s infinite ease-in-out alternate;
        }
        @keyframes flameBreath {
            0% { transform: scale(0.7) translateY(0); opacity: 0.6; }
            100% { transform: scale(1.3) translateY(-8px); opacity: 1; box-shadow: 0 0 30px var(--flame-amber), 0 0 60px var(--divine-gold); }
        }
        .rainbow-heart-marker {
            width: 30px;
            height: 30px;
            fill: url(#rainbowGradient);
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
            animation: heartBeat 2s infinite ease-in-out alternate;
        }
        @keyframes heartBeat { 0% { transform: scale(0.9); } 100% { transform: scale(1.3); } }
        .text-shimmer {
            background: linear-gradient(90deg, #fff, var(--divine-gold), #fff, var(--crystal-pink), #fff);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmerText 8s linear infinite;
        }
        @keyframes shimmerText { to { background-position: 200% center; } }
        #map { height: 450px; width: 100%; border-radius: 2rem; background: #08080e; }
        @media (min-width: 768px) { #map { height: 750px; border-radius: 3rem; } }
        .crystal-popup .leaflet-popup-content-wrapper { background: rgba(10, 10, 25, 0.95); backdrop-filter: blur(20px); color: white; border-radius: 1.5rem; }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client"
      }
    }
    </script>
</head>
<body class="selection:bg-rose-500/30">
    <svg style="width:0;height:0;position:absolute;">
        <defs>
            <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ff0000" /><stop offset="50%" style="stop-color:#ffff00" /><stop offset="100%" style="stop-color:#9400d3" />
            </linearGradient>
        </defs>
    </svg>
    <div id="root"></div>

    <script type="module">
        import React, { createContext, useContext, useState, useEffect, useRef } from 'react';
        import ReactDOM from 'react-dom/client';

        const GAS_URL = "https://script.google.com/macros/s/AKfycbzJHC7Rtm-A0yibWSy9mNz0Ofcd7TDOvcg6EVd383M9pdobQk6TO7PBLfk4B_-D614wtQ/exec";
        const TELEGRAM_LINK = "https://t.me/DEIN_LINK"; // HIER DEINEN LINK EINTRAGEN

        const SACRED_ANCHORS = [
            { name: "Heart of Oceania", location: "Australia", lat: -25.2744, lng: 133.7751 },
            { name: "Dragon Heart Anchor", location: "Hong Kong", lat: 22.3193, lng: 114.1694 },
            { name: "Ancient Stones Portal", location: "Externsteine, Germany", lat: 51.8694, lng: 8.9174 },
            { name: "Pacific Light Gateway", location: "California, USA", lat: 36.7783, lng: -119.4179 }
        ];

        const ThemeContext = createContext({ theme: 'dark', toggleTheme: () => {} });
        const ThemeProvider = ({ children }) => {
            const [theme, setTheme] = useState('dark');
            const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');
            useEffect(() => { document.documentElement.classList.toggle('dark', theme === 'dark'); }, [theme]);
            return React.createElement(ThemeContext.Provider, { value: { theme, toggleTheme } }, children);
        };
        const useTheme = () => useContext(ThemeContext);

        const Header = () => {
            const { theme, toggleTheme } = useTheme();
            return React.createElement('header', { className: "sticky top-0 z-50 w-full glass px-4 md:px-8 py-4 flex justify-between items-center" },
                React.createElement('div', { className: "flex items-center gap-4" },
                    React.createElement('span', { className: "text-[10px] font-black tracking-widest uppercase opacity-70 font-fancy" }, "21. March 2026 - Love Meditation")
                ),
                React.createElement('div', { className: "flex items-center gap-4" },
                    React.createElement('a', { href: TELEGRAM_LINK, target: "_blank", className: "hidden md:block px-6 py-2 glass rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-white/10" }, "Telegram"),
                    React.createElement('button', { onClick: toggleTheme, className: "w-10 h-10 rounded-xl glass flex items-center justify-center" }, theme === 'dark' ? "☀️" : "🌙")
                )
            );
        };

        const App = () => {
            const { theme } = useTheme();
            const [flames, setFlames] = useState([]);
            const [form, setForm] = useState({ name: '', location: '' });
            const [status, setStatus] = useState('idle');
            const mapRef = useRef(null);
            const mapInstance = useRef(null);

            useEffect(() => {
                if (!mapInstance.current && mapRef.current) {
                    mapInstance.current = L.map(mapRef.current, { center: [20, 0], zoom: 2.5, zoomControl: false, attributionControl: false });
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png').addTo(mapInstance.current);
                    
                    SACRED_ANCHORS.forEach(a => {
                        const icon = L.divIcon({ className: '', html: `<svg class="rainbow-heart-marker" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`, iconSize:[30,30], iconAnchor:[15,15] });
                        L.marker([a.lat, a.lng], { icon }).addTo(mapInstance.current).bindPopup(`<b class="text-black">${a.name}</b>`);
                    });
                }
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setStatus('loading');
                try {
                    const geo = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(form.location)}&limit=1`).then(r => r.json());
                    if (!geo.length) throw new Error("Location not found");
                    const payload = { ...form, lat: geo[0].lat, lng: geo[0].lon, timestamp: new Date().toISOString() };
                    await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                    setStatus('success');
                    mapInstance.current.flyTo([geo[0].lat, geo[0].lon], 8);
                    setForm({ name: '', location: '' });
                    setTimeout(() => setStatus('idle'), 5000);
                } catch (err) { alert(err.message); setStatus('idle'); }
            };

            return React.createElement('div', { className: `min-h-screen ${theme === 'dark' ? 'bg-[#040406] text-white' : 'bg-[#fcfcfc] text-slate-900'}` },
                React.createElement(Header),
                React.createElement('main', { className: "max-w-7xl mx-auto px-4 py-20 space-y-32" },
                    // HERO
                    React.createElement('section', { className: "text-center space-y-12" },
                        React.createElement('h1', { className: "text-6xl md:text-[10rem] font-fancy font-black leading-tight" }, "Light a ", React.createElement('br'), React.createElement('span', { className: "text-shimmer" }, "flame of LOVE")),
                        React.createElement('p', { className: "text-xl md:text-3xl font-light opacity-80" }, "One Earth. One Heart. One Flame."),
                        React.createElement('div', { className: "flex flex-col md:flex-row justify-center gap-6" },
                            React.createElement('a', { href: "#signup", className: "px-12 py-6 rounded-full bg-gradient-to-r from-amber-400 to-rose-600 font-fancy text-sm uppercase tracking-widest text-white shadow-2xl" }, "Anchor my light"),
                            React.createElement('a', { href: TELEGRAM_LINK, target: "_blank", className: "px-12 py-6 rounded-full border-2 border-amber-500 text-amber-500 font-fancy text-sm uppercase tracking-widest hover:bg-amber-500 hover:text-black transition-all" }, "Join Telegram")
                        )
                    ),
                    // I AM YOUNIVERSE
                    React.createElement('section', { className: "glass p-12 md:p-24 rounded-[3rem] text-center space-y-8" },
                        React.createElement('h3', { className: "text-2xl md:text-4xl font-fancy" }, "In Collaboration with I AM YOUNIVERSE"),
                        React.createElement('p', { className: "max-w-3xl mx-auto text-lg md:text-2xl font-light opacity-90 leading-relaxed" }, 
                            "We are merging our fields with I AM YOUNIVERSE, a movement dedicated to the realization of our collective divinity. Together, we build the bridge between individual awakening and global resonance."
                        ),
                        React.createElement('a', { href: "https://iamyouniverse.org", target: "_blank", className: "inline-block text-amber-500 border-b border-amber-500/30 font-bold" }, "iamyouniverse.org")
                    ),
                    // MAP
                    React.createElement('section', { id: "map-section", className: "crystal-border glass p-1 shadow-2xl" },
                        React.createElement('div', { ref: mapRef, id: "map" })
                    ),
                    // FORM
                    React.createElement('section', id="signup", { className: "max-w-3xl mx-auto glass crystal-border p-12 space-y-12" },
                        status === 'success' ? 
                        React.createElement('div', { className: "text-center py-10" }, React.createElement('h2', { className: "text-3xl font-fancy text-amber-500 animate-pulse" }, "Light Anchored!")) :
                        React.createElement('form', { onSubmit: handleSubmit, className: "space-y-6" },
                            React.createElement('h2', { className: "text-2xl font-fancy text-center" }, "Join the Grid"),
                            React.createElement('input', { className: "w-full p-6 rounded-3xl bg-white/5 border border-white/10 outline-none focus:border-amber-500", placeholder: "Your Name", value: form.name, onChange: e => setForm({...form, name: e.target.value}), required: true }),
                            React.createElement('input', { className: "w-full p-6 rounded-3xl bg-white/5 border border-white/10 outline-none focus:border-amber-500", placeholder: "City, Country", value: form.location, onChange: e => setForm({...form, location: e.target.value}), required: true }),
                            React.createElement('button', { type: "submit", className: "w-full py-6 rounded-full bg-gradient-to-r from-amber-400 to-rose-600 font-fancy text-sm uppercase tracking-widest text-white shadow-xl" }, status === 'loading' ? 'Transmitting...' : 'Anchor my Light')
                        )
                    )
                )
            );
        };

        const Root = () => React.createElement(ThemeProvider, null, React.createElement(App));
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Root));
    </script>
</body>
