<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light a Flame of Love | Global Resonance 2026</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Montserrat:wght@100;200;300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --flame-amber: #f59e0b;
            --crystal-pink: #f472b6;
            --love-rose: #e11d48;
            --divine-gold: #fbbf24;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #040406;
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        h1, h2, h3, .font-fancy {
            font-family: 'Cinzel Decorative', cursive;
        }

        .glass {
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 2rem;
        }

        .flame-marker {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 50% 50%, #fff 0%, var(--divine-gold) 25%, var(--flame-amber) 55%, var(--love-rose) 100%);
            border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
            box-shadow: 0 0 15px var(--flame-amber), 0 0 35px var(--divine-gold);
            animation: flameBreath 3s infinite ease-in-out alternate;
            cursor: pointer;
        }
        @keyframes flameBreath {
            0% { transform: scale(0.7) translateY(0); opacity: 0.6; }
            100% { transform: scale(1.3) translateY(-8px); opacity: 1; box-shadow: 0 0 30px var(--flame-amber), 0 0 60px var(--divine-gold); }
        }

        .text-shimmer {
            background: linear-gradient(90deg, #fff, var(--divine-gold), #fff, var(--crystal-pink), #fff);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmerText 8s linear infinite;
        }
        @keyframes shimmerText {
            to { background-position: 200% center; }
        }

        #map { height: 500px; width: 100%; border-radius: 2rem; margin-top: 20px; }
    </style>
</head>
<body class="selection:bg-rose-500/30">

    <div id="root"></div>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script>
        const { useState, useEffect, useRef, createElement } = React;

        function App() {
            const mapRef = useRef(null);
            const [theme, setTheme] = useState('dark');

            const SACRED_ANCHORS = [
                { name: "Heart of Oceania", lat: -25.2744, lng: 133.7751 },
                { name: "Lotus Heart", lat: 7.8804, lng: 98.3923 },
                { name: "Himalayan Soul Core", lat: 28.3949, lng: 84.1240 },
                { name: "Heart of Bavaria", lat: 48.1351, lng: 11.5820 }
            ];

            useEffect(() => {
                if (!mapRef.current) return;
                const map = L.map(mapRef.current).setView([20, 0], 2);

                L.tileLayer(theme === 'dark'
                    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
                    : 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
                ).addTo(map);

                SACRED_ANCHORS.forEach(a => {
                    L.marker([a.lat, a.lng], {
                        icon: L.divIcon({ className: '', html: '<div class="flame-marker"></div>', iconSize: [20,20], iconAnchor:[10,10] })
                    }).addTo(map).bindPopup(`<b>${a.name}</b>`);
                });

            }, [theme]);

            return createElement("div", { className: "p-8 space-y-8" },
                createElement("h1", { className: "text-5xl font-fancy text-shimmer" }, "Light a flame of LOVE"),
                createElement("button", { 
                    onClick: () => setTheme(theme === 'dark' ? 'light' : 'dark'), 
                    className: "px-6 py-3 rounded-xl bg-amber-500 font-bold"
                }, `Toggle Theme: ${theme}`),
                createElement("div", { ref: mapRef, id: "map" })
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(createElement(App));
    </script>
</body>
</html>
